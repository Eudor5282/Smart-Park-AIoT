services:
  smart-car-parking:
    build: .
    container_name: smart-car-parking
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      # เก็บ history.jsonl (ประวัติการจอด) ไว้นอก container ไม่งั้นข้อมูล
      # หายทุกครั้งที่ deploy ใหม่/รีสตาร์ท container
      - parking-history:/app/Model

    # ----------------------------------------------------------------
    # สำคัญมาก: กล้องเว็บแคม
    # ----------------------------------------------------------------
    # โค้ด cam_ai_server.py เปิดกล้องด้วย cv2.VideoCapture() จาก "ข้างใน"
    # container ก่อน ถ้าเปิดไม่ได้ (หาอุปกรณ์กล้องในเครื่องไม่เจอ) จะสลับไป
    # โหมดรอรับภาพจาก POST /frame โดยอัตโนมัติแทน
    #
    # กรณี Linux host จริง ๆ ที่มี USB webcam ต่ออยู่ (ไม่ใช่ Windows/Docker
    # Desktop): เปิดคอมเมนต์บรรทัดด้านล่างนี้ได้ (เช็ค path จริงด้วย
    # `ls /dev/video*` บนเครื่องโฮสต์ก่อน):
    #
    # devices:
    #   - "/dev/video0:/dev/video0"
    #
    # กรณี Windows (Docker Desktop): Docker Desktop บน Windows รันผ่าน WSL2
    # ซึ่ง "มองไม่เห็น" USB webcam ของเครื่องโดยตรง (เป็นข้อจำกัดของ WSL2 เอง
    # ไม่ใช่บั๊กของโปรเจกต์นี้) devices: ด้านบนจะใช้ไม่ได้ผลบน Windows
    # ให้ "ปล่อยส่วนนี้ไว้เป็นคอมเมนต์" แล้วรัน `camera_uploader.py` แยกต่างหาก
    # บนเครื่อง Windows โดยตรง (นอก Docker) เพื่อส่งภาพเข้ามาแทน — วิธีทำเต็ม ๆ
    # อยู่ใน START-HERE-WINDOWS.md

volumes:
  parking-history:
