# ใช้ไฟล์นี้บน Linux (native Linux หรือ Raspberry Pi) เท่านั้น
# เพราะ "devices:" ด้านล่างต้องพึ่ง /dev/video0 ของ Linux kernel โดยตรง
# Windows/Mac ไม่มี path นี้ -> ดู README.md หัวข้อ Windows/Mac
#
# วิธีรัน:
#   1. เสียบกล้อง USB เข้าเครื่อง host ก่อน
#   2. เช็คว่ากล้องคือ /dev/video0 จริงไหม: ls -l /dev/video*
#      ถ้าเป็นเลขอื่น (เช่น /dev/video1) ให้แก้บรรทัด devices ด้านล่างให้ตรง
#   3. docker compose up --build -d
#   4. เปิด http://<IP เครื่อง host>:5000 จากเครื่องไหนก็ได้ในวง LAN เดียวกัน

services:
  smart-parking:
    build: .
    container_name: smart-parking
    restart: unless-stopped
    ports:
      - "5000:5000"
    devices:
      - "/dev/video0:/dev/video0"
    environment:
      - CAM_INDEX=0
      - CAP_WIDTH=640
      - CAP_HEIGHT=480
      - PORT=5000
    volumes:
      # เก็บ history.jsonl (ประวัติการจอด) ไว้นอก container เพื่อไม่ให้ข้อมูลหายเวลา
      # rebuild/ลบ container แล้วสร้างใหม่
      - ./Model:/app/Model
